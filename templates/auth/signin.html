{% extends "base.html" %}
{% block title %}Sign In | SmartVote{% endblock %}
{% block content %}
<div class="auth-layout single-auth">
<section class="card auth-card">
  <div class="login-mark">SV</div><p class="eyebrow">VOTER ACCESS</p><h1>Welcome back</h1><p class="muted">Sign in first. We will then ask you to verify your registered face.</p>
  <form method="post"><div class="field"><label>Voter ID or email</label><input name="login" placeholder="VOTER001 or email" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn primary full">Sign in & continue</button></form>
  <p class="auth-switch">New voter? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
</div>
{% endblock %}
